<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#03060a"/><stop offset=".5" stop-color="#071525"/><stop offset="1" stop-color="#03060a"/></linearGradient>
  <linearGradient id="blue"><stop stop-color="#58a6ff"/><stop offset=".5" stop-color="#9b7cff"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="orb"><stop stop-color="#58a6ff" stop-opacity=".25"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<circle cx="150" cy="100" r="180" fill="url(#orb)"><animate attributeName="r" values="160;210;160" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="1040" cy="280" r="220" fill="url(#orb)" opacity=".5"><animate attributeName="r" values="190;240;190" dur="7s" repeatCount="indefinite"/></circle>
<g fill="#58a6ff" opacity=".65">
 <circle cx="90" cy="285" r="2"><animate attributeName="cy" values="285;245;285" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="1080" cy="80" r="2"><animate attributeName="cy" values="80;115;80" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="1010" cy="125" r="1.5"><animate attributeName="cx" values="1010;970;1010" dur="5s" repeatCount="indefinite"/></circle>
 <circle cx="180" cy="70" r="1.5"><animate attributeName="cx" values="180;220;180" dur="4s" repeatCount="indefinite"/></circle>
</g>
<path d="M80 285 C260 240 320 320 500 275 S820 220 1120 270" fill="none" stroke="url(#blue)" stroke-width="1" opacity=".3">
 <animate attributeName="d" values="M80 285 C260 240 320 320 500 275 S820 220 1120 270;M80 270 C260 315 320 230 500 285 S820 300 1120 250;M80 285 C260 240 320 320 500 275 S820 220 1120 270" dur="8s" repeatCount="indefinite"/>
</path>
<text x="600" y="155" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="800" letter-spacing="14" fill="white" filter="url(#glow)">MOHIT</text>
<text x="600" y="205" text-anchor="middle" font-family="monospace" font-size="17" letter-spacing="5" fill="#58a6ff">STILL LEARNING · STILL BUILDING</text>
<line x1="390" y1="235" x2="810" y2="235" stroke="#58a6ff" stroke-opacity=".35">
 <animate attributeName="x1" values="500;390;500" dur="4s" repeatCount="indefinite"/><animate attributeName="x2" values="700;810;700" dur="4s" repeatCount="indefinite"/>
</line>
<text x="600" y="270" text-anchor="middle" font-family="monospace" font-size="12" fill="#8b949e">AI × CODE × IDEAS × PRODUCTS</text>
</svg>
