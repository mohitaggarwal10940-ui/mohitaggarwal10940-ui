<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230">
<defs>
 <linearGradient id="g"><stop stop-color="#58a6ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="230" rx="24" fill="#05070a"/>
<g fill="#58a6ff">
 <circle cx="100" cy="180" r="2"><animate attributeName="cy" values="180;145;180" dur="3s" repeatCount="indefinite"/></circle>
 <circle cx="1080" cy="55" r="2"><animate attributeName="cy" values="55;85;55" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="950" cy="170" r="1.5"><animate attributeName="cx" values="950;910;950" dur="5s" repeatCount="indefinite"/></circle>
</g>
<text x="600" y="88" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" letter-spacing="5" fill="white" filter="url(#glow)">STILL LEARNING.</text>
<text x="600" y="125" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" letter-spacing="5" fill="url(#g)">STILL BUILDING.</text>
<text x="600" y="165" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="3" fill="#8b949e">THE NEXT VERSION IS ALWAYS LOADING</text>
<path d="M350 195 H850" stroke="url(#g)" stroke-width="2" stroke-linecap="round"><animate attributeName="d" values="M500 195 H700;M350 195 H850;M500 195 H700" dur="4s" repeatCount="indefinite"/></path>
</svg>
